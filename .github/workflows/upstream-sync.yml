name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00 (北京时间 10:00) 自动检查并同步上游更新
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击一键同步

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'Eyozy/podstarter' }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@1090e365224fc834e7e1de521c417ded2d6fcb53 # v3.4.1
        with:
          upstream_sync_repo: Eyozy/podstarter
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_pull_args: --allow-unrelated-histories
          test_mode: false
